<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Garden of Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Georgia&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-screen" class="screen">
        <div class="content">
            <div class="title-container">
                <svg class="flower-icon left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="25" r="20" fill="#ff88aa" />
                    <circle cx="75" cy="40" r="20" fill="#ff88aa" />
                    <circle cx="65" cy="75" r="20" fill="#ff88aa" />
                    <circle cx="35" cy="75" r="20" fill="#ff88aa" />
                    <circle cx="25" cy="40" r="20" fill="#ff88aa" />
                    <circle cx="50" cy="50" r="15" fill="#ffdd88" />
                </svg>
                <h1 class="title">The Garden of Us</h1>
                <svg class="flower-icon right" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="25" r="20" fill="#ff88aa" />
                    <circle cx="75" cy="40" r="20" fill="#ff88aa" />
                    <circle cx="65" cy="75" r="20" fill="#ff88aa" />
                    <circle cx="35" cy="75" r="20" fill="#ff88aa" />
                    <circle cx="25" cy="40" r="20" fill="#ff88aa" />
                    <circle cx="50" cy="50" r="15" fill="#ffdd88" />
                </svg>
            </div>
            <p class="subtitle">A journey through our memories</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p id="loading-text" class="fade-text">Adding magic...</p>
            <button id="enter-btn" class="hidden">Enter the Garden</button>
        </div>
    </div>

    <div id="ui-container">
        <!-- Persistent UI -->
        <button id="audio-toggle" class="icon-btn" aria-label="Toggle Audio">
            <svg class="audio-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>

        <!-- Memory Popup -->
        <div id="memory-popup" class="popup hidden">
            <div class="popup-content glass">
                <h2 id="memory-title"></h2>
                <p id="memory-text"></p>
                <button id="close-memory-btn">Close</button>
            </div>
        </div>

        <!-- Story Overlay -->
        <div id="story-overlay" class="overlay hidden">
            <p id="story-text" class="fade-text"></p>
        </div>

        <!-- Letter View -->
        <div id="letter-view" class="popup hidden">
            <div class="letter-paper">
                <div id="letter-content"></div>
                <div id="letter-signature"></div>
                <button id="close-letter-btn" class="hidden">Close & Continue</button>
            </div>
        </div>

        <!-- Choice View -->
        <div id="choice-view" class="screen hidden">
            <div class="content" style="max-width: 900px; background: none; box-shadow: none;">
                <h2 style="font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 0 0 20px rgba(255,255,255,0.3);">What would you like to do?</h2>
                <p style="margin-bottom: 3rem; font-size: 1.2rem; color: var(--text-secondary);">There's no wrong answer. This is your choice.</p>
                <div class="choice-cards">
                    <button class="choice-card forgive" data-choice="forgive">
                        <div class="card-icon">💚</div>
                        <h3>I forgive you</h3>
                        <p>Let's grow together</p>
                    </button>
                    <button class="choice-card message" data-choice="message">
                        <div class="card-icon">💌</div>
                        <h3>Leave a message</h3>
                        <p>I have something to say</p>
                    </button>
                    <button class="choice-card time" data-choice="time">
                        <div class="card-icon">🚶</div>
                        <h3>I need time</h3>
                        <p>And that's okay</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- Choice Input/Confirmation -->
         <div id="message-input-view" class="popup hidden">
            <div class="popup-content glass">
                <h3>Leave a message</h3>
                <textarea id="message-text" placeholder="Write your message here..."></textarea>
                <div class="buttons">
                    <button id="cancel-message-btn">Cancel</button>
                    <button id="send-message-btn">Send</button>
                </div>
            </div>
        </div>

         <div id="final-message-view" class="popup hidden">
             <div class="popup-content glass">
                <h2 id="final-title"></h2>
                <p id="final-body"></p>
                <button id="explore-msg-btn" style="margin-top: 2rem;">Explore the Garden</button>
             </div>
         </div>

         <!-- Certificate View -->
         <div id="certificate-view" class="popup hidden">
            <div class="popup-content glass certificate-border">
                <h2>Thank You</h2>
                <p>For giving us a chance to grow.</p>
                <div class="certificate-icon">
                    <svg viewBox="0 0 100 100" style="width: 4rem; height: 4rem; display: block; margin: 0 auto;">
                         <path d="M50 90 Q50 50 20 40 Q20 10 50 30 Q80 10 80 40 Q50 50 50 90" fill="#88ff88" stroke="#55aa55" stroke-width="2"/>
                    </svg>
                </div>
                <button id="explore-btn">Explore the Garden</button>
            </div>
         </div>

    </div>

    <canvas id="canvas"></canvas>
    <script type="module" src="/main.js"></script>
</body>
</html>
